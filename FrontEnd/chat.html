<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <link rel="stylesheet" href="framework/bootstrap/bootstrap.min.css">
    <style>
        body::-webkit-scrollbar {
            display: none;
        }
    </style>

</head>
<body>
<!-- Loading Screen -->
<div id="loading" class="position-fixed top-0 start-0 w-100 h-100"
     style="display: none; z-index: 1050; background-color: rgba(0,0,0,0.8)">
    <div class="py-4 w-100 text-white d-flex justify-content-center align-items-center column-gap-2 position-absolute top-50 start-50 translate-middle">
        <lottie-player
                src="assets/img/lottie/square-loader.json"
                background="transparent"
                speed="1"
                loop="true"
                autoplay="true"
                style="width: 120px; height: 120px;">
        </lottie-player>
    </div>
</div>

<nav class="navbar navbar-expand-md fixed-top navbar-shrink py-3 bg-light shadow" id="mainNav">
    <div class="container">
        <img id="siteLogo" src="assets/img/illustrations/quill-pen.svg" alt="User Logo"
             class="rounded-circle object-fit-cover me-2" style="width: 40px; height: 40px;">

        <a class="navbar-brand d-flex align-items-center"
           href="user.html"><span>Digital Art Gallery</span></a>
        <button data-bs-toggle="collapse" class="navbar-toggler" data-bs-target="#navcol-1"><span
                class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navcol-1">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="user.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="user-items.html">Arts</a></li>
                <li class="nav-item"><a class="nav-link" href="chat.html">Chat</a></li>
                <li class="nav-item"><a class="nav-link" href="">Contact Us</a></li>
                <li class="nav-item"><a class="nav-link" href="">FAQ</a></li>
            </ul>
            <div class="dropdown">
                <div class="d-flex align-items-center profile-dropdown" data-bs-toggle="dropdown"
                     style="cursor: pointer;">
                    <img id="navProfileLogo" src="assets/img/illustrations/user.svg" alt="User Logo"
                         class="rounded-circle object-fit-cover me-2" style="width: 40px; height: 40px;">
                    <span id="navProfileName" class="fw-bold"></span>
                </div>
                <ul class="text-center dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="profile.html">View Profile</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <button id="logOutBtn" class="dropdown-item text-danger">Log out</button>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</nav>


<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow rounded-4 border-0">
                <div class="card-header bg-primary text-white fw-bold text-center rounded-top-4">
                    Live Chat
                </div>
                <div id="chat-messages" class="card-body bg-light overflow-auto" style="height: 400px;">
                    <!-- Messages will be appended here -->
                </div>
                <div class="card-footer bg-white border-top-0">
                    <div class="input-group">
                        <input type="text" id="chat-input" class="form-control rounded-start-3"
                               placeholder="Type a message...">
                        <button class="btn btn-primary rounded-end-3" id="send-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="framework/bootstrap/bootstrap.bundle.min.js"></script>
<script src="framework/jquery/jquery-3.7.1.min.js"></script>
<script src="framework/sweetalert2/sweetalert2@11.js"></script>
<script src="js/util.js"></script>
<script>
    $(document).ready(function () {
        loadNavProfile();
    });

    $('#logOutBtn').click(function () {
        logout()
    });
</script>
<script>
    $(document).ready(function () {
        $('#send-btn').on('click', sendMessage);
        $('#chat-input').on('keypress', function (e) {
            if (e.which === 13) sendMessage();
        });
    });

    function sendMessage() {
        const input = $('#chat-input');
        const message = input.val().trim();
        if (!message) return;

        appendMessage('You', message);
        input.val('');

        // Simulated reply
        setTimeout(() => {
            appendMessage('Admin', 'Thanks for your message!');
        }, 1000);
    }

    function appendMessage(sender, text) {
        const msgHTML = `
            <div class="mb-2">
                <span class="fw-semibold text-primary">${sender}:</span>
                <span class="text-dark">${text}</span>
            </div>
        `;
        $('#chat-messages').append(msgHTML);
        $('#chat-messages').scrollTop($('#chat-messages')[0].scrollHeight);
    }
</script>

</body>
</html>
