<!DOCTYPE html>
<html data-bs-theme="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Arts</title>
    <link rel="stylesheet" href="framework/bootstrap/bootstrap.min.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>
<!-- Loading Screen -->
<div id="loading" class="position-fixed top-0 start-0 w-100 h-100"
     style="display: none; z-index: 1050; background-color: rgba(0,0,0,0.8)">
    <div class="py-4 w-100 text-white d-flex justify-content-center align-items-center column-gap-2 position-absolute top-50 start-50 translate-middle">
        <lottie-player
                src="assets/img/lottie/square-loader.json"
                background="transparent"
                speed="1"
                loop="true"
                autoplay="true"
                style="width: 120px; height: 120px;">
        </lottie-player>
    </div>
</div>

<!-- Start: Navbar Centered Links -->
<nav class="navbar navbar-expand-md fixed-top navbar-shrink py-3 bg-light shadow" id="mainNav">
    <div class="container">
        <img id="siteLogo" src="assets/img/illustrations/quill-pen.svg" alt="User Logo" class="rounded-circle object-fit-cover me-2" style="width: 40px; height: 40px;">

        <a class="navbar-brand d-flex align-items-center"
           href="user.html"><span>Digital Art Gallery</span></a>
        <button data-bs-toggle="collapse" class="navbar-toggler" data-bs-target="#navcol-1"><span
                class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navcol-1">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="user.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="user-items.html">Arts</a></li>
                <li class="nav-item"><a class="nav-link" href="">Contact Us</a></li>
                <li class="nav-item"><a class="nav-link" href="">FAQ</a></li>
            </ul>
        </div>
        <div class="dropdown">
            <div class="d-flex align-items-center profile-dropdown" data-bs-toggle="dropdown" style="cursor: pointer;">
                <img id="navProfileLogo" src="assets/img/illustrations/user.svg" alt="User Logo" class="rounded-circle object-fit-cover me-2" style="width: 40px; height: 40px;">
                <span id="navProfileName" class="fw-bold"></span>
            </div>
            <ul class="text-center dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="profile.html">View Profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><button id="logOutBtn" class="dropdown-item text-danger">Log out</button></li>
            </ul>
        </div>
    </div>
</nav>
<section class="py-5"><!-- Start: Team -->
    <div class="container py-5 ">
        <div class="row mb-4 mb-lg-5">
            <div class="col-md-8 col-xl-6 text-center mx-auto">
                <h2 class="fw-bold">Arts</h2>
                <p class="text-muted">No matter the project, our team can handle it.&nbsp;</p>
                <!--Post Art Button-->
                <button class="btn btn-gradient btn-outline-success fw-bold shadow rounded-5 px-4" type="button"
                        data-bs-toggle="modal" data-bs-target="#artPostModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Post Item
                </button>
                <button id="myItemsBtn" class="btn btn-gradient btn-outline-success fw-bold shadow rounded-5 px-4" type="button"
                        >My Items
                </button>
            </div>
        </div>

        <!-- Post Art Modal -->
        <div class="modal fade" id="artPostModal" tabindex="-1" aria-labelledby="artPostModalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content border-0 rounded-5 shadow-lg"
                     style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);">

                    <!-- Modal Header -->
                    <div class="modal-header border-0 py-3"
                         style="background: linear-gradient(135deg, #2a58b6, #222222); color: #ffffff;">
                        <h2 class="modal-title fw-bold" id="artPostModalLabel">Upload Your Artwork</h2>
                        <button type="button" class="btn-close btn-close-white"
                                data-bs-dismiss="modal"></button>
                    </div>

                    <!-- Modal Body -->
                    <div class="modal-body p-4">
                        <form id="postArtForm" class="needs-validation">

                            <div class="d-flex flex-row column-gap-3 w-100">
                                <div class="d-flex flex-column row-gap-3 w-50">
                                    <!-- Category Selector -->
                                    <div class="form-floating mb-3">
                                        <select class="form-select shadow-sm rounded-4" id="categorySelect"
                                                required>
                                        </select>
                                        <label for="categorySelect">Art Category</label>
                                    </div>

                                    <!-- Art Name -->
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control shadow-sm rounded-4" id="name"
                                               name="name"
                                               placeholder=" " required>
                                        <label for="name">Art Name</label>
                                    </div>

                                    <!-- Description -->
                                    <div class="form-floating mb-3">
                                        <textarea class="form-control shadow-sm rounded-4" id="description" name="description" rows="3" required></textarea>
                                        <label for="description">Description</label>
                                    </div>
                                </div>
                                <div class="d-flex flex-column row-gap-3 w-50">
                                    <!-- Upload item Photo -->
                                    <div class="col-md-4 text-center w-100 h-100">
                                        <div class="position-relative d-flex flex-column align-items-center w-100 h-100 row-gap-2">
                                            <img id="selectItemPhotoPreview"
                                                 src="assets/img/illustrations/desk.svg"
                                                 class="rounded-5 object-fit-cover shadow" alt="Item Image"
                                                 style="width: 210px; height: 200px;">

                                            <input id="itemImageFileInput" type="file" name="itemImage"
                                                   class="form-control mt-2 d-none" accept="image/*">
                                            <button id="chooseItemImageBtn" type="button" class="btn btn-outline-success rounded-5">Choose</button>
                                        </div>

                                    </div>
                                </div>
                            </div>


                            <!-- Price & Quantity -->
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="number" class="form-control shadow-sm rounded-4" id="price"
                                               name="price" min="0" step="0.01" required>
                                        <label for="price">Price (USD)</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="number" class="form-control shadow-sm rounded-4" id="qty"
                                               name="qty" min="1" required>
                                        <label for="qty">Quantity</label>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Modal Footer -->
                    <div class="modal-footer border-0 d-flex justify-content-center py-3">
                        <button type="button" class="btn btn-light rounded-pill px-4 shadow-sm"
                                data-bs-dismiss="modal">Cancel
                        </button>
                        <button id="postArtBtn" type="button"
                                class="btn rounded-pill btn-outline-dark px-5 shadow">Post Art
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!--all art list column-->
        <div class="row mx-auto col">
            <!--art row-->
            <div id="itemBrowseContainer" class="p-2 row row-gap-4">
            </div>

            <!-- View Art Modal -->
            <div class="modal fade" id="viewItemModal" tabindex="-1" aria-labelledby="viewArtModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered"> <!-- Fixed modal size and centered -->
                    <div class="modal-content px-4 py-2" style="width: 700px; max-width: 700px;"> <!-- Fixed width -->

                        <!-- Modal Header -->
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="itemModalTitle">Artwork Name</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <!-- Modal Body -->
                        <div class="modal-body">
                            <div class="row">
                                <!-- Left Side: Fixed Image -->
                                <div class="col-md-6 d-flex justify-content-center align-items-center">
                                    <img id="itemModalImage" class="rounded-4 shadow-sm" src="" alt="Artwork"
                                         style="width: 100%; height: 300px; object-fit: cover;">
                                </div>

                                <!-- Right Side: Fixed Item Details -->
                                <div class="col-md-6">
                                    <div class="mt-2 text-muted"><span id="itemModalDescription">Description will be here...</span></div>

                                    <div class="mt-3">
                                        <h5 class="text-dark fw-semibold">LKR <span id="itemModalPrice">0</span></h5>
                                        <span class="badge bg-primary p-2">Stock: <span id="itemModalQty">0</span></span>
                                    </div>

                                    <div class="mt-3">
                                        <span class="text-muted">Posted By:</span>
                                        <span id="itemModalUser" class="fw-bold">Artist Name</span>
                                    </div>

                                    <!-- Action Buttons -->
                                    <div class="mt-4 d-flex gap-2">
                                        <button class="btn btn-dark px-4 rounded-5">Buy Now</button>
                                        <button class="btn btn-outline-secondary px-4 rounded-5">Add to Wishlist</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Edit Art Modal -->
            <div class="modal fade" id="editItemModal" tabindex="-1" aria-labelledby="editArtModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered">
                    <div class="modal-content px-4 py-2" style="width: 700px; max-width: 700px;">

                        <!-- Modal Header -->
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold">Edit Artwork</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <!-- Modal Body -->
                        <div class="modal-body">
                            <form id="editItemForm">
                                <div class="row">
                                    <!-- Left Side: Image Upload -->
                                    <div class="col-md-6 d-flex flex-column align-items-center">
                                        <label class="form-label fw-semibold">Artwork Image</label>
                                        <img id="editItemImagePreview" class="rounded-4 shadow-sm mb-2"
                                             src="assets/img/illustrations/quill-pen.svg" alt="Artwork Preview"
                                             style="width: 100%; height: 250px; object-fit: cover;">
                                        <input type="file" class="form-control" id="editItemImage" accept="image/*" hidden="">
                                        <button id="editItemImgBtn" type="button" class="btn btn-success rounded-5">Choose</button>
                                    </div>

                                    <!-- Right Side: Edit Details -->
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="editItemTitle" class="form-label fw-semibold">Artwork Name</label>
                                            <input type="text" class="form-control" id="editItemTitle" required>
                                        </div>

                                        <div class="mb-3">
                                            <label for="editItemDescription" class="form-label fw-semibold">Description</label>
                                            <textarea class="form-control" id="editItemDescription" rows="3" required></textarea>
                                        </div>

                                        <div class="mb-3">
                                            <label for="editItemPrice" class="form-label fw-semibold">Price (LKR)</label>
                                            <input type="number" class="form-control" id="editItemPrice" min="0" required>
                                        </div>

                                        <div class="mb-3">
                                            <label for="editItemQty" class="form-label fw-semibold">Stock Quantity</label>
                                            <input type="number" class="form-control" id="editItemQty" min="0" required>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <!-- Modal Footer -->
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-dark" id="saveEditItem">Save Changes</button>
                        </div>

                    </div>
                </div>
            </div>


        </div>
    </div><!-- End: Team -->
</section>
<script src="framework/bootstrap/bootstrap.bundle.min.js"></script>
<script src="framework/jquery/jquery-3.7.1.min.js"></script>
<script src="framework/sweetalert2/sweetalert2@11.js"></script>
<script src="js/util.js"></script>
<script src="js/item.js"></script>
<script>
    $(document).ready(function () {

        $('#logOutBtn').click(function () {
            logout()
        });

        loadNavProfile("user");
        getAllCategoriesAndSet()
        getAllItemsForBrowse()
    });
</script>
</body>
</html>
