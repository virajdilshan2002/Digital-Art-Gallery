<!DOCTYPE html>
<html data-bs-theme="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Page Not Found - Brand</title>
    <link rel="stylesheet" href="framework/bootstrap/bootstrap.min.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="w-100 vh-100 d-flex justify-content-center align-items-center"><!-- Start: Navbar Centered Links -->
<!-- Loading Screen -->
<div id="loading" class="position-fixed top-0 start-0 w-100 h-100"
     style="display: none; z-index: 1050; background-color: rgba(0,0,0,0.8)">
    <div class="py-4 w-100 text-white d-flex justify-content-center align-items-center column-gap-2 position-absolute top-50 start-50 translate-middle">
        <lottie-player
                src="assets/img/lottie/square-loader.json"
                background="transparent"
                speed="1"
                loop
                autoplay
                style="width: 120px; height: 120px;">
        </lottie-player>
    </div>
</div>

<section class="d-flex justify-content-center align-items-center h-100 w-100 container">
    <div class="container text-center">
<!--        <img class="img-fluid w-50" alt="Server Error" src="assets/img/illustrations/404.svg">-->
        <div class="w-100 d-flex justify-content-center mb-1">
            <lottie-player
                    src="assets/img/lottie/settings-error.json"
                    background="transparent"
                    speed="1"
                    loop
                    autoplay
                    style="width: 200px; height: 200px;">
            </lottie-player>
        </div>

        <h2 class="display-3 fw-bold mb-3">Server Error</h2>
        <p class="fs-4 text-muted">Unfortunately, Server might be down or unreachable.<br> Please try again later.</p>
        <button id="tryAgainBtn" class="btn btn-outline-danger shadow fw-bold rounded-4 px-4 mt-3">Try Again</button>
    </div>
</section>

<script src="framework/bootstrap/bootstrap.bundle.min.js"></script>
<script src="framework/jquery/jquery-3.7.1.min.js"></script>
<script src="framework/sweetalert2/sweetalert2@11.js"></script>
<script src="js/util.js"></script>
<script>

    $("#tryAgainBtn").click(function () {

        $.ajax({
            url: "http://localhost:8080/api/v1/server/status",
            method: "GET",
            success: function (response) {
                if (response.code === 200) {
                    showAlert("success", "Success", "Server is up and running.")
                    window.location.href = "index.html"
                }
            },
            error: function (xhr) {
                Swal.fire({
                    icon: "warning",
                    title: "Warning!",
                    text: "Cannot connect to the server!",
                })
            }
        });

    });

</script>
</body>
</html>
