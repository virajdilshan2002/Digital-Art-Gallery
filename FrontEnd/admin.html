<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | Dashboard</title>
    <meta name="description" content="Admin Dashboard">
    <link rel="stylesheet" href="framework/bootstrap/bootstrap.min.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        body::-webkit-scrollbar {
            display: none;
        }
    </style>
    <!-- Gradient Button Style -->c
    <style>
        .btn-gradient {
            background: linear-gradient(135deg, #1b1b1b, #3d2900);
            color: white;
            border: none;
            transition: all 3s ease-in-out !important;
        }

        .btn-gradient:hover {
            background: linear-gradient(135deg, #5a3e00, #000000);
            color: white;
        }



    </style>
</head>
<body>
<!-- Loading Screen -->
<div id="loading" class="position-fixed top-0 start-0 w-100 h-100"
     style="display: none; z-index: 1050; background-color: rgba(0,0,0,0.8)">
    <div class="py-4 w-100 text-white d-flex justify-content-center align-items-center column-gap-2 position-absolute top-50 start-50 translate-middle">
        <lottie-player
                src="assets/img/lottie/square-loader.json"
                background="transparent"
                speed="1"
                loop="true"
                autoplay="true"
                style="width: 120px; height: 120px;">
        </lottie-player>
    </div>
</div>

<nav class="navbar navbar-expand-md fixed-top navbar-shrink py-3 bg-light shadow" id="mainNav">
    <div class="container">
        <img id="siteLogo" src="assets/img/illustrations/quill-pen.svg" alt="User Logo"
             class="rounded-circle object-fit-cover me-2" style="width: 40px; height: 40px;">

        <a class="navbar-brand d-flex align-items-center"
           href="user.html"><span>Digital Art Gallery</span></a>
        <button data-bs-toggle="collapse" class="navbar-toggler" data-bs-target="#navcol-1"><span
                class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navcol-1">

            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="admin.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-items.html">Arts</a></li>
                <li class="nav-item"><a class="nav-link" href="">Contact Us</a></li>
                <li class="nav-item"><a class="nav-link" href="">FAQ</a></li>
            </ul>
            <div class="dropdown">
                <div class="d-flex align-items-center profile-dropdown" data-bs-toggle="dropdown"
                     style="cursor: pointer;">
                    <img id="navProfileLogo" src="assets/img/illustrations/user.svg" alt="Admin Logo"
                         class="rounded-circle object-fit-cover me-2" style="width: 40px; height: 40px;">
                    <span id="navProfileName" class="fw-bold"></span>
                </div>
                <ul class="text-center dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="profile.html">View Profile</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <button id="logOutBtn" class="dropdown-item text-danger">Log out</button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<header class="pt-5">
    <div class="container pt-4 pt-xl-5">
        <div class="row pt-5">
            <div class="col-md-8 text-center text-md-start mx-auto">
                <div class="text-center"><h1 class="display-4 fw-bold mb-5">Welcome To Digital
                    Art&nbsp;<br><span id="userName"></span>!</h1>
                    <p class="fs-5 text-muted mb-5">Sell your digital art or, hand painted art.</p>
                    <!--<div class="d-flex justify-content-center flex-wrap column-gap-2"
                         data-bs-theme="light">
                        <div class="shadow-lg mb-3">
                            <input class="form-control" type="text" name="search"
                                   placeholder="Art"></div>
                        <div class="shadow-lg mb-3">
                            <button class="btn btn-primary px-4" type="button">Search Art</button>
                        </div>

                    </div>-->
                    <div class="d-flex flex-wrap gap-3 p-3 justify-content-center">
                        <!--Add Admin Button-->
                        <button class="btn btn-gradient btn-outline-success fw-bold shadow rounded-5 px-4" type="button"
                                data-bs-toggle="modal" data-bs-target="#addAdminModal">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Add Admin
                        </button>
                        <!--Add Category Button-->
                        <button class="btn btn-gradient btn-outline-success fw-bold shadow rounded-5 px-4" type="button"
                                data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Add Category
                        </button>
                        <!--Post Art Button-->
                        <button class="btn btn-gradient btn-outline-success fw-bold shadow rounded-5 px-4" type="button"
                                data-bs-toggle="modal" data-bs-target="#artPostModal">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Post Item
                        </button>
                    </div>

                    <!-- Add Admin Modal -->
                    <div class="modal fade" id="addAdminModal" tabindex="-1" aria-labelledby="addAdminModalLabel"
                         aria-hidden="true">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content border-0 rounded-5 shadow-lg"
                                 style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);">

                                <!-- Modal Header -->
                                <div class="modal-header border-0 py-3"
                                     style="background: linear-gradient(135deg, #2a58b6, #222222); color: #ffffff;">
                                    <h2 class="modal-title fw-bold" id="addAdminModalLabel">Add New Admin</h2>
                                    <button type="button" class="btn-close btn-close-white"
                                            data-bs-dismiss="modal"></button>
                                </div>

                                <!-- Modal Body -->
                                <div class="modal-body p-4">
                                    <form id="AddAdminForm" class="needs-validation">
                                        <!-- name & desc -->
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control shadow-sm rounded-4" id="adminName"
                                                           name="price" min="0" step="0.01" placeholder=" " required>
                                                    <label for="price">Admin Name</label>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control shadow-sm rounded-4" id="adminDesc"
                                                           name="qty" min="1" placeholder=" " required>
                                                    <label for="qty">Password</label>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>

                                <!-- Modal Footer -->
                                <div class="modal-footer border-0 d-flex justify-content-center py-3">
                                    <button type="button" class="btn btn-light rounded-pill px-4 shadow-sm"
                                            data-bs-dismiss="modal">Cancel
                                    </button>
                                    <button id="addAdminBtn" type="button"
                                            class="btn btn-outline-dark rounded-pill px-5 shadow">Add Admin
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Add Category Modal -->
                    <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel"
                         aria-hidden="true">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content border-0 rounded-5 shadow-lg"
                                 style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);">

                                <!-- Modal Header -->
                                <div class="modal-header border-0 py-3"
                                     style="background: linear-gradient(135deg, #2a58b6, #222222); color: #ffffff;">
                                    <h2 class="modal-title fw-bold" id="addCategoryModalLabel">Add New Category</h2>
                                    <button type="button" class="btn-close btn-close-white"
                                            data-bs-dismiss="modal"></button>
                                </div>

                                <!-- Modal Body -->
                                <div class="modal-body p-4">
                                    <form id="AddCategoryForm" class="needs-validation">
                                        <!-- name & desc -->
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control shadow-sm rounded-4" id="categoryName"
                                                           name="price" min="0" step="0.01" required>
                                                    <label for="price">Category Name</label>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control shadow-sm rounded-4" id="categoryDesc"
                                                           name="qty" min="1" required>
                                                    <label for="qty">Category Desc</label>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>

                                <!-- Modal Footer -->
                                <div class="modal-footer border-0 d-flex justify-content-center py-3">
                                    <button type="button" class="btn btn-light rounded-pill px-4 shadow-sm"
                                            data-bs-dismiss="modal">Cancel
                                    </button>
                                    <button id="addCategoryBtn" type="button"
                                            class="btn btn-outline-dark rounded-pill px-5 shadow">Add Category
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Post Art Modal -->
                    <div class="modal fade" id="artPostModal" tabindex="-1" aria-labelledby="artPostModalLabel"
                         aria-hidden="true">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content border-0 rounded-5 shadow-lg"
                                 style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);">

                                <!-- Modal Header -->
                                <div class="modal-header border-0 py-3"
                                     style="background: linear-gradient(135deg, #2a58b6, #222222); color: #ffffff;">
                                    <h2 class="modal-title fw-bold" id="artPostModalLabel">Upload Your Artwork</h2>
                                    <button type="button" class="btn-close btn-close-white"
                                            data-bs-dismiss="modal"></button>
                                </div>

                                <!-- Modal Body -->
                                <div class="modal-body p-4">
                                    <form id="postArtForm" class="needs-validation">

                                        <div class="d-flex flex-row column-gap-3 w-100">
                                            <div class="d-flex flex-column row-gap-3 w-50">
                                                <!-- Category Selector -->
                                                <div class="form-floating mb-3">
                                                    <select class="form-select shadow-sm rounded-4" id="categorySelect"
                                                            required>
                                                    </select>
                                                    <label for="categorySelect">Art Category</label>
                                                </div>

                                                <!-- Art Name -->
                                                <div class="form-floating mb-3">
                                                    <input type="text" class="form-control shadow-sm rounded-4" id="name"
                                                           name="name"
                                                           placeholder=" " required>
                                                    <label for="name">Art Name</label>
                                                </div>

                                                <!-- Description -->
                                                <div class="form-floating mb-3">
                                                    <textarea class="form-control shadow-sm rounded-4" id="description" name="description" rows="3" required></textarea>
                                                    <label for="description">Description</label>
                                                </div>
                                            </div>
                                            <div class="d-flex flex-column row-gap-3 w-50">
                                                <!-- Upload item Photo -->
                                                <div class="col-md-4 text-center w-100 h-100">
                                                    <div class="position-relative d-flex flex-column align-items-center w-100 h-100 row-gap-2">
                                                        <img id="selectItemPhotoPreview"
                                                             src="assets/img/illustrations/desk.svg"
                                                             class="rounded-5 object-fit-cover shadow" alt="Item Image"
                                                             style="width: 210px; height: 200px;">

                                                        <input id="itemImageFileInput" type="file" name="itemImage"
                                                               class="form-control mt-2 d-none" accept="image/*">
                                                        <button id="chooseItemImageBtn" type="button" class="btn btn-outline-success rounded-5">Choose</button>
                                                    </div>

                                                </div>
                                            </div>
                                        </div>


                                        <!-- Price & Quantity -->
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <div class="form-floating">
                                                    <input type="number" class="form-control shadow-sm rounded-4" id="price"
                                                           name="price" min="0" step="0.01" required>
                                                    <label for="price">Price (USD)</label>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="form-floating">
                                                    <input type="number" class="form-control shadow-sm rounded-4" id="qty"
                                                           name="qty" min="1" required>
                                                    <label for="qty">Quantity</label>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>

                                <!-- Modal Footer -->
                                <div class="modal-footer border-0 d-flex justify-content-center py-3">
                                    <button type="button" class="btn btn-light rounded-pill px-4 shadow-sm"
                                            data-bs-dismiss="modal">Cancel
                                    </button>
                                    <button id="postArtBtn" type="button"
                                            class="btn rounded-pill btn-outline-dark px-5 shadow">Post Art
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>
</header>

<script src="framework/bootstrap/bootstrap.bundle.min.js"></script>
<script src="framework/jquery/jquery-3.7.1.min.js"></script>

<script src="js/util.js"></script>
<script src="js/admin.js"></script>
<script src="js/item.js"></script>

        loadNavProfile();
        getAllCategoriesAndSet()
        postItemBtnClick()
    });
</script>
</body>
</html>
