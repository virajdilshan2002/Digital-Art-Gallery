<!-- reset-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Loading Screen -->
<div id="loading" class="position-fixed top-0 start-0 w-100 h-100"
     style="display: none; z-index: 1050; background-color: rgba(0,0,0,0.8)">
    <div class="py-4 w-100 text-white d-flex justify-content-center align-items-center column-gap-2 position-absolute top-50 start-50 translate-middle">
        <lottie-player
                src="assets/img/lottie/square-loader.json"
                background="transparent"
                speed="1"
                loop="true"
                autoplay="true"
                style="width: 120px; height: 120px;">
        </lottie-player>
    </div>
</div>
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body">
            <h5 class="card-title text-center mb-4">Reset Password</h5>

            <div id="step-email">
                <form id="emailForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Enter your email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send OTP</button>
                </form>
            </div>

            <div id="step-otp" class="d-none">
                <form id="otpForm">
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="newPassword" required>
                    </div>
                    <div class="mb-3">
                        <label for="otp" class="form-label">Enter the OTP sent to your email</label>
                        <input type="text" class="form-control" id="otp" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Verify OTP</button>
                </form>
            </div>

            <div id="message" class="mt-3 text-center text-success d-none">Password changed successfully!</div>
        </div>
    </div>
</div>

<script src="framework/jquery/jquery-3.7.1.min.js"></script>
<script src="framework/sweetalert2/sweetalert2@11.js"></script>
<script src="js/util.js"></script>
<script>
    let userEmail = '';

    $('#emailForm').submit(function(e) {
        e.preventDefault();
        userEmail = $('#email').val();

        $.ajax({
            url: 'http://localhost:8080/api/v1/auth/sendOtp?email=' + userEmail,
            method: 'POST',
            success: function() {
                $('#step-email').addClass('d-none');
                $('#step-otp').removeClass('d-none');
                showAlert("success", "OTP Sent", "An OTP has been sent to your email. Please check your inbox. And Please enter your new password.");
            },
            error: function(err) {
                showAlert("error", "Error Sending OTP", err.responseJSON.message);
            }
        });
    });

    $('#otpForm').submit(function(e) {
        e.preventDefault();
        const enteredOtp = $('#otp').val();
        const newPassword = $('#newPassword').val();

        $.ajax({
            url: 'http://localhost:8080/api/v1/auth/verifyOtp?otp=' + enteredOtp + `&pw=${newPassword}&email=${userEmail}`,
            method: 'POST',
            success: function() {
                $('#step-otp').addClass('d-none');
                $('#step-newpw').removeClass('d-none');
                showAlert("success", "Password Changed Successfully!", "Please login again with your new password.");
                window.location.href = "login.html"
            },
            error: function(err) {
                showAlert("error", "Invalid OTP", err.responseJSON.message);
            }
        });
    });

</script>

</body>
</html>
