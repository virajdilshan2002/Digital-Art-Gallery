spring.application.name=BackEnd
spring.datasource.url = jdbc:mysql://localhost:3306/digitalartgallery?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = xxxx
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto = update
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view = false
spring.jpa.show-sql = true
spring.main.allow-bean-definition-overriding = true
jwt.secret = xxxx
server.port = 8080

# Spring Boot Actuator Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Spring Security OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id = xxxx
spring.security.oauth2.client.registration.google.client-secret = xxxx
spring.security.oauth2.client.registration.google.scope = profile,email

# Spring Mail Configuration
spring.mail.host = smtp.gmail.com
spring.mail.port = 587
spring.mail.username = xxxx
spring.mail.password = xxxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
